<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-label="Chapel under a starry night sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132238"/>
      <stop offset="60%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#3b6ea5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6e7c1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f6e7c1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35563a"/>
      <stop offset="100%" stop-color="#27422e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="800" fill="url(#sky)"/>

  <g fill="#ffffff" opacity="0.85">
    <circle cx="150" cy="140" r="3"/>
    <circle cx="320" cy="80" r="2"/>
    <circle cx="520" cy="200" r="3"/>
    <circle cx="760" cy="110" r="2"/>
    <circle cx="980" cy="170" r="3"/>
    <circle cx="1150" cy="90" r="2"/>
    <circle cx="1380" cy="150" r="3"/>
    <circle cx="1490" cy="230" r="2"/>
    <circle cx="230" cy="280" r="2"/>
    <circle cx="880" cy="60" r="3"/>
    <circle cx="1260" cy="260" r="2"/>
    <circle cx="70" cy="360" r="2"/>
    <circle cx="1450" cy="380" r="2"/>
  </g>

  <circle cx="1240" cy="180" r="90" fill="url(#glow)"/>
  <g stroke="#f6e7c1" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9">
    <circle cx="1240" cy="180" r="52"/>
    <circle cx="1240" cy="180" r="68"/>
  </g>
  <circle cx="1240" cy="180" r="46" fill="#f6e7c1"/>

  <ellipse cx="800" cy="700" rx="900" ry="200" fill="url(#lawn)"/>
  <rect x="0" y="700" width="1600" height="100" fill="#1d301f"/>

  <g id="chapel">
    <rect x="560" y="430" width="480" height="250" fill="#0e1b30"/>
    <rect x="560" y="430" width="480" height="250" fill="#12233d"/>
    <polygon points="510,435 800,330 1090,435" fill="#0a1526"/>
    <rect x="785" y="150" width="30" height="190" fill="#0e1b30"/>
    <polygon points="770,150 830,150 800,70" fill="#0a1526"/>
    <rect x="785" y="150" width="30" height="60" fill="#16294a"/>

    <g fill="#f6e7c1">
      <rect x="595" y="475" width="40" height="70" rx="3"/>
      <rect x="655" y="475" width="40" height="70" rx="3"/>
      <rect x="715" y="475" width="40" height="70" rx="3"/>
      <rect x="905" y="475" width="40" height="70" rx="3"/>
      <rect x="965" y="475" width="40" height="70" rx="3"/>
    </g>

    <g fill="#8a5a2b">
      <rect x="860" y="530" width="90" height="150" rx="2"/>
      <path d="M905 535 Q933 560 905 585 Q877 560 905 535 Z" fill="#f6e7c1"/>
      <circle cx="905" cy="500" r="26" fill="#f6e7c1"/>
    </g>

    <circle cx="800" cy="205" r="14" fill="#f6e7c1"/>
  </g>

  <g id="trees">
    <circle cx="250" cy="560" r="70" fill="#1f3b2a"/>
    <rect x="242" y="610" width="16" height="70" fill="#16281d"/>
    <circle cx="1350" cy="565" r="80" fill="#1f3b2a"/>
    <rect x="1341" y="625" width="18" height="70" fill="#16281d"/>
  </g>
</svg>